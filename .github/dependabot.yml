version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 3
  groups:
    minor-updates:
      update-types:
      - minor
      - patch
- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 3
  groups:
    ESLint:
      patterns:
      - eslint
      - "@typescript-eslint/*"
      - "@eslint/*"
      - typescript-eslint
    Rollup:
      patterns:
      - rollup
      - "@rollup/*"
    Jest:
      patterns:
      - jest
      - "@types/jest"
      - ts-jest
    minor-updates:
      dependency-type: production
      update-types:
      - minor
      - patch
    development-dependencies:
      dependency-type: development
- package-ecosystem: "npm"
  directories:
  - "/vsts-variable-set/v1"
  - "/vsts-variable-set/v2"
  - "/vsts-variable-set/v3"
  - "/vsts-variable-transform/v1"
  - "/vsts-variable-transform/v2"
  - "/vsts-variable-transform/v3"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 3
  groups:
    minor-updates:
      dependency-type: production
      update-types:
      - minor
      - patch
    development-dependencies:
      dependency-type: development
  ignore:
  - dependency-name: "azure-pipelines-task-lib"
    update-types: [ "version-update:semver-major" ]
