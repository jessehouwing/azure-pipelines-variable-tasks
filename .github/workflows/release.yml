name: Release
run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name || github.ref }}
# Multi-job release workflow for Azure DevOps extension.
#
# Required secrets:
#   AZURE_CLIENT_ID       - Azure AD app client ID for OIDC authentication
#   AZURE_TENANT_ID       - Azure AD tenant ID for OIDC authentication
#
# Required repository variables:
#   AZDO_TEST_PIPELINE_NAME  - Name of the Azure DevOps test pipeline to trigger
#
# Required environments (with protection rules):
#   private  - For preview release and testing
#   public   - For production releases (requires approval)

on:
  push:
    branches:
      - 'release/v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g., 3.1.0). Optional — if omitted, the current marketplace version is queried and patch-incremented.'
        required: false
        type: string
      dry_run:
        description: 'Test only: prepare, preview and test without publishing to the Marketplace or creating the GitHub release'
        required: false
        type: boolean
        default: false

permissions: {}

env:
  PUBLISHER_ID: jessehouwing
  EXTENSION_ID: jessehouwing-vsts-variable-tasks

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Prepare release branch
  # Idempotent — safe to re-run after pushing fixes to the release branch.
  # ---------------------------------------------------------------------------
  prepare-release:
    name: Prepare release
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.query-version.outputs.proposed-version }}
      branch: release/v${{ steps.query-version.outputs.proposed-version }}
      vsix-file-name: ${{ steps.package.outputs.vsix-file-name }}
      vsix-attestation-url: ${{ steps.attest-vsix.outputs.attestation-url }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Extract requested version
        id: requested
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = ""
          if ($env:GH_EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_VERSION -ne "") {
            $version = $env:INPUT_VERSION
          }
          elseif ($env:GH_REF_NAME -match '^release/v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          }
          if ($version -ne "" -and $version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Warning "Input version '$version' is not in X.Y.Z format — ignoring"
            $version = ""
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Query version
        id: query-version
        uses: jessehouwing/azdo-marketplace/query-version@v6.3.16
        with:
          auth-type: oidc
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}
          version-source: |
            ${{ steps.requested.outputs.version }}
            marketplace
          marketplace-version-action: Patch

      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Create or checkout release branch
        env:
          PROPOSED_VERSION: ${{ steps.query-version.outputs.proposed-version }}
        shell: pwsh
        run: |
          $branch = "release/v$env:PROPOSED_VERSION"
          git ls-remote --exit-code --heads origin "$branch" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Branch $branch already exists, checking it out"
            git fetch origin "$branch"
            git checkout "$branch"
            git pull origin "$branch"
          }
          else {
            Write-Host "Creating branch $branch from main"
            git checkout -b "$branch"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        shell: pwsh
        run: |
          $stopMarker = [guid]::NewGuid().ToString()
          Write-Host "::stop-commands::$stopMarker"
          npm run test
          Write-Host "::$stopMarker::"

      - name: Run Pester tests
        shell: pwsh
        run: |
          $stopMarker = [guid]::NewGuid().ToString()
          Write-Host "::stop-commands::$stopMarker"
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser
          Invoke-Pester -Path './vsts-variable-*' -Output Detailed -CI
          Write-Host "::$stopMarker::"

      - name: Package extension
        uses: jessehouwing/azdo-marketplace/package@v6.3.16
        id: package
        with:
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}
          extension-version: ${{ steps.query-version.outputs.proposed-version }}
          update-tasks-version: minor
          output-path: ${{ runner.temp }}

      # Attests the exact VSIX bytes produced here; downstream jobs consume the
      # unmodified artifact and verify it with `gh attestation verify`.
      - name: Attest build provenance (VSIX)
        id: attest-vsix
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.vsix-file }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix-file }}
          if-no-files-found: error

      - name: Commit and push changes
        env:
          PROPOSED_VERSION: ${{ steps.query-version.outputs.proposed-version }}
        shell: pwsh
        run: |
          $branch = "release/v$env:PROPOSED_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
          }
          else {
            git commit -m "chore: prepare release v$env:PROPOSED_VERSION"
          }
          git push origin "HEAD:$branch"

  # ---------------------------------------------------------------------------
  # Job 2: Preview release to Azure DevOps (jessehouwing-dev org)
  # Publishes a private preview extension with unique task IDs.
  # ---------------------------------------------------------------------------
  preview-release:
    name: Preview release (Azure DevOps)
    needs: [prepare-release]
    runs-on: windows-latest
    environment:
      name: 'private'
      url: https://marketplace.visualstudio.com/items?itemName=${{ env.PUBLISHER_ID }}.${{ env.EXTENSION_ID }}-dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish preview extension
        uses: jessehouwing/azdo-marketplace/publish@v6.3.16
        id: publish
        with:
          auth-type: oidc
          use: vsix
          vsix-file: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}-dev
          extension-visibility: private_preview
          update-tasks-id: true
          no-wait-validation: true

      - name: Wait for validation
        uses: jessehouwing/azdo-marketplace/wait-for-validation@v6.3.16
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          timeout-minutes: '30'

      - name: Share extension
        uses: jessehouwing/azdo-marketplace/share@v6.3.16
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing-dev

      - name: Install extension
        uses: jessehouwing/azdo-marketplace/install@v6.3.16
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing-dev

      - name: Wait for installation
        uses: jessehouwing/azdo-marketplace/wait-for-installation@v6.3.16
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          timeout-minutes: '30'
          accounts: |
            https://dev.azure.com/jessehouwing-dev

  # ---------------------------------------------------------------------------
  # Job 3: Test Azure Pipelines
  # Triggers the Azure DevOps test pipeline and waits for completion.
  # ---------------------------------------------------------------------------
  test-azure-pipelines:
    name: Test Azure Pipelines (${{ matrix.vmImage }}, Node ${{ matrix.nodeVersion }})
    needs: [prepare-release, preview-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vmImage:
          - ubuntu-latest
          - windows-latest
        nodeVersion:
          - '20.x'
          - '24.x'
    environment:
      name: 'private'
      url: ${{ steps.run-azdo-pipeline.outputs.pipeline_run_url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        id: get-azdo-token
        shell: pwsh
        run: |
          $token = az account get-access-token `
            --resource 499b84ac-1321-427f-aa17-267ca6975798 `
            --query accessToken --output tsv
          Write-Host "::add-mask::$token"
          echo "azdo_token=$token" >> $env:GITHUB_OUTPUT

      - name: Run Azure DevOps test pipeline
        id: run-azdo-pipeline
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ steps.get-azdo-token.outputs.azdo_token }}
          AZDO_PIPELINE_NAME: ${{ vars.AZDO_TEST_PIPELINE_NAME }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          AZDO_ORGANIZATION: https://dev.azure.com/jessehouwing-dev
          AZDO_PROJECT: azure-pipelines-variable-tasks-test
          TEST_VM_IMAGE: ${{ matrix.vmImage }}
          TEST_NODE_VERSION: ${{ matrix.nodeVersion }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Az {
            param(
              [Parameter(Mandatory = $true)]
              [string[]]$Arguments
            )

            $output = & az @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Azure CLI command failed: az $($Arguments -join ' ')"
            }

            return $output
          }

          $organization = $env:AZDO_ORGANIZATION
          $project = $env:AZDO_PROJECT
          $pipelineName = $env:AZDO_PIPELINE_NAME
          $branch = "release/v$($env:RELEASE_VERSION)"
          $timeoutSeconds = 1800
          $intervalSeconds = 30

          if (-not $organization) {
            throw 'AZDO_ORGANIZATION is empty.'
          }

          if (-not $project) {
            throw 'AZDO_PROJECT is empty.'
          }

          if (-not $pipelineName) {
            throw 'AZDO_PIPELINE_NAME is empty. Set repository variable AZDO_TEST_PIPELINE_NAME.'
          }

          if (-not $env:RELEASE_VERSION) {
            throw 'RELEASE_VERSION is empty. Prepare release output is missing.'
          }

          Invoke-Az -Arguments @('config', 'set', 'extension.use_dynamic_install=yes_without_prompt') | Out-Null
          Invoke-Az -Arguments @('extension', 'add', '--name', 'azure-devops', '--upgrade', '--only-show-errors') | Out-Null

          if (-not $env:AZURE_DEVOPS_EXT_PAT) {
            throw 'AZURE_DEVOPS_EXT_PAT is not set. Token step must run before this step.'
          }

          Invoke-Az -Arguments @('config', 'set', 'core.enable_secure_credential_store=false') | Out-Null
          Invoke-Az -Arguments @('devops', 'configure', '--defaults', "organization=$organization", "project=$project") | Out-Null

          $runId = (Invoke-Az -Arguments @(
            'pipelines', 'run',
            '--name', $pipelineName,
            '--branch', $branch,
            '--org', $organization,
            '--project', $project,
            '--detect', 'false',
            '--parameters',
            "vmImage=$($env:TEST_VM_IMAGE)",
            "nodeVersion=$($env:TEST_NODE_VERSION)",
            '--query', 'id',
            '--output', 'tsv'
          )).Trim()

          if (-not $runId) {
            throw 'Failed to trigger Azure DevOps pipeline run.'
          }

          "pipeline_run_id=$runId" >> $env:GITHUB_OUTPUT
          $runUrl = "$organization/$project/_build/results?buildId=$runId&view=results"
          "pipeline_run_url=$runUrl" >> $env:GITHUB_OUTPUT

          Write-Host "Triggered pipeline run: $runId"
          Write-Host "Pipeline run URL: $runUrl"
          "- Azure Pipelines run: [$runId]($runUrl)" >> $env:GITHUB_STEP_SUMMARY

          $elapsed = 0
          while ($elapsed -lt $timeoutSeconds) {
            $runJson = Invoke-Az -Arguments @(
              'pipelines', 'runs', 'show',
              '--id', $runId,
              '--org', $organization,
              '--project', $project,
              '--detect', 'false',
              '--output', 'json'
            )
            $run = $runJson | ConvertFrom-Json

            $status = if ($null -ne $run.status) { [string]$run.status } else { '' }
            $result = if ($null -ne $run.result) { [string]$run.result } else { '' }

            Write-Host "Pipeline status: $status, result: $result (${elapsed}s elapsed)"

            if ($status -eq 'completed') {
              if ($result -eq 'succeeded') {
                Write-Host 'Pipeline succeeded'
                exit 0
              }

              throw "Pipeline failed with result: $result"
            }

            Start-Sleep -Seconds $intervalSeconds
            $elapsed += $intervalSeconds
          }

          throw "Pipeline timed out after ${timeoutSeconds}s"

      - name: Cancel Azure DevOps pipeline run if parent workflow was cancelled
        if: ${{ cancelled() && steps.run-azdo-pipeline.outputs.pipeline_run_id != '' }}
        continue-on-error: true
        env:
          AZDO_PIPELINE_RUN_ID: ${{ steps.run-azdo-pipeline.outputs.pipeline_run_id }}
          AZDO_ORGANIZATION: https://dev.azure.com/jessehouwing-dev
          AZDO_PROJECT: azure-pipelines-variable-tasks-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            az pipelines runs cancel `
              --id $env:AZDO_PIPELINE_RUN_ID `
              --org $env:AZDO_ORGANIZATION `
              --project $env:AZDO_PROJECT `
              --detect false `
              --output none
            Write-Host "Cancelled Azure DevOps pipeline run $($env:AZDO_PIPELINE_RUN_ID)."
          }
          catch {
            Write-Warning "Unable to cancel Azure DevOps pipeline run $($env:AZDO_PIPELINE_RUN_ID): $($_.Exception.Message)"
            exit 0
          }

  # ---------------------------------------------------------------------------
  # Job 4: Production release to marketplace
  # Requires environment approval before running.
  # ---------------------------------------------------------------------------
  publish-production:
    name: Publish to marketplace
    needs: [prepare-release, preview-release, test-azure-pipelines]
    if: ${{ !inputs.dry_run }}
    runs-on: windows-latest
    environment:
      name: public
      url: https://marketplace.visualstudio.com/items?itemName=${{ env.PUBLISHER_ID }}.${{ env.EXTENSION_ID }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Verify VSIX build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSIX_FILE: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
        run: gh attestation verify "$VSIX_FILE" --repo "$GITHUB_REPOSITORY"
        shell: bash

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Detects a retry after this exact version was already published (e.g. a
      # previous run's publish succeeded but "Wait for validation" timed out).
      - name: Check current marketplace version
        id: check-version
        uses: jessehouwing/azdo-marketplace/query-version@v6.3.16
        with:
          auth-type: oidc
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}
          version-source: |
            marketplace
            0.0.0
          marketplace-version-action: None

      - name: Skip publish (version already deployed)
        if: steps.check-version.outputs.current-version == needs.prepare-release.outputs.version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: Write-Host "Version $env:RELEASE_VERSION is already published, skipping publish and re-checking validation."
        shell: pwsh

      - name: Publish production extension
        uses: jessehouwing/azdo-marketplace/publish@v6.3.16
        id: publish
        if: steps.check-version.outputs.current-version != needs.prepare-release.outputs.version
        with:
          auth-type: oidc
          use: vsix
          vsix-file: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
          no-wait-validation: true
          extension-visibility: public

      - name: Wait for validation
        uses: jessehouwing/azdo-marketplace/wait-for-validation@v6.3.16
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file || format('{0}/vsix/{1}', runner.temp, needs.prepare-release.outputs.vsix-file-name) }}
          timeout-minutes: '30'

  # ---------------------------------------------------------------------------
  # Job 5: Create GitHub release
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub release
    needs: [prepare-release, publish-production]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Verify VSIX build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSIX_FILE: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
        run: gh attestation verify "$VSIX_FILE" --repo "$GITHUB_REPOSITORY"
        shell: bash

      - name: Create and push tag
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: pwsh
        run: |
          $version = "v$env:RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$env:RELEASE_VERSION" -m "Release v$env:RELEASE_VERSION"
          git push origin "v$env:RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: v${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          body: |
            Build provenance attestation: ${{ needs.prepare-release.outputs.vsix-attestation-url }}
            Verify with: `gh attestation verify <vsix> --repo ${{ github.repository }}`
          files: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}

  # ---------------------------------------------------------------------------
  # Job 6: Cleanup preview extension after successful production release
  # ---------------------------------------------------------------------------
  cleanup-preview:
    name: Cleanup preview extension
    needs: [prepare-release, publish-production]
    runs-on: ubuntu-latest
    if: always() && needs.publish-production.result == 'success'
    environment: private

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Unshare preview extension
        uses: jessehouwing/azdo-marketplace/unshare@v6.3.16
        continue-on-error: true
        with:
          auth-type: oidc
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}-dev
          accounts: |
            https://dev.azure.com/jessehouwing-dev
